services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/opencutweb
    depends_on:
      - db
    networks:
      - default
      - traefik_main

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opencut.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.opencut.entrypoints=websecure"
      - "traefik.http.routers.opencut.tls=true"
      - "traefik.http.middlewares.opencut-headers.headers.customResponseHeaders.Cross-Origin-Embedder-Policy=require-corp"
      - "traefik.http.middlewares.opencut-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.routers.opencut.middlewares=opencut-headers"
      - "traefik.http.services.opencut.loadbalancer.server.port=3000"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
    volumes:
      - transcription_tmp:/app/tmp/transcriptions

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_change_me
      POSTGRES_DB: opencutweb
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default

  worker:
    build:
      context: ./apps/worker
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - transformer_cache:/root/.cache/huggingface
      - transcription_tmp:/app/tmp/transcriptions
    networks:
      - default

volumes:
  pgdata:
  transformer_cache:
  transcription_tmp:

networks:
  default:
  traefik_main:
    external: true
    name: ${TRAEFIK_NETWORK}
